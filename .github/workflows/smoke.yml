name: Smoke

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      openclaw_build_mode:
        description: Build from an official image or from source
        required: false
        default: image
        type: choice
        options:
          - image
          - source
      openclaw_image_tag:
        description: Official OpenClaw image tag or tag@digest
        required: false
        type: string
      openclaw_git_ref:
        description: OpenClaw commit, tag, or branch used in source mode
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test

  container:
    runs-on: ubuntu-latest
    needs: test
    env:
      DEFAULT_OPENCLAW_IMAGE_TAG: 2026.8.1
    steps:
      - uses: actions/checkout@v7
      - name: Build selected OpenClaw version
        env:
          INPUT_BUILD_MODE: ${{ inputs.openclaw_build_mode }}
          INPUT_VERSION: ${{ inputs.openclaw_image_tag }}
          INPUT_GIT_REF: ${{ inputs.openclaw_git_ref }}
          REPOSITORY_BUILD_MODE: ${{ vars.OPENCLAW_BUILD_MODE }}
          REPOSITORY_VERSION: ${{ vars.OPENCLAW_IMAGE_TAG }}
          REPOSITORY_GIT_REF: ${{ vars.OPENCLAW_GIT_REF }}
        run: |
          mode="${INPUT_BUILD_MODE:-${REPOSITORY_BUILD_MODE:-image}}"
          version="${INPUT_VERSION:-${REPOSITORY_VERSION:-$DEFAULT_OPENCLAW_IMAGE_TAG}}"
          git_ref="${INPUT_GIT_REF:-${REPOSITORY_GIT_REF:-main}}"
          docker build \
            --build-arg "OPENCLAW_BUILD_MODE=$mode" \
            --build-arg "OPENCLAW_IMAGE_TAG=$version" \
            --build-arg "OPENCLAW_GIT_REF=$git_ref" \
            -t openclaw-railway:smoke .
      - name: Run Gateway smoke test
        run: |
          set -euo pipefail
          container="openclaw-railway-smoke"
          volume="openclaw-railway-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token="$(openssl rand -hex 32)"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run -d --name "$container" \
            -p 127.0.0.1:18080:8080 \
            -e "OPENCLAW_GATEWAY_TOKEN=$token" \
            -e RAILWAY_PUBLIC_DOMAIN=claw-smoke.up.railway.app \
            -e RAILWAY_OPENCLAW_PUBLIC_ORIGIN=https://claw.example.com \
            -e TELEGRAM_BOT_TOKEN=123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi \
            -v "$volume:/data" \
            openclaw-railway:smoke >/dev/null

          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/startupz >/dev/null; then
              ready=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$container" | grep -qx true; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container"
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/healthz >/dev/null
          if ! docker logs "$container" 2>&1 | grep -E 'http server listening .*telegram' >/dev/null; then
            echo "Telegram plugin did not register" >&2
            docker logs "$container"
            exit 1
          fi

          docker exec "$container" node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("/data/.openclaw/openclaw.json", "utf8"));
            if (config.gateway.mode !== "local" || config.gateway.bind !== "lan") process.exit(1);
            if (!config.gateway.trustedProxies.includes("100.64.0.3")) process.exit(1);
            if (Object.hasOwn(config.gateway.controlUi, "basePath")) process.exit(1);
            if (!config.gateway.controlUi.allowedOrigins.includes("https://claw-smoke.up.railway.app")) process.exit(1);
            if (!config.gateway.controlUi.allowedOrigins.includes("https://claw.example.com")) process.exit(1);
            if (config.agents.defaults.workspace !== "/data/workspace") process.exit(1);
            if (!fs.existsSync("/data/.openclaw-railway-owned-v1")) process.exit(1);
          '
          docker exec "$container" sh -c \
            'ps -eo uid,gid,args | grep "[o]penclaw-gateway" | grep -q "^ *1000 *1000 "'
          docker exec "$container" sh -c \
            'test "$OPENCLAW_SUPERVISOR_MODE" = external'

          owner_url="$(docker exec "$container" openclaw-railway owner-url 2>/dev/null)"
          case "$owner_url" in
            https://claw.example.com/\#*) ;;
            *) echo "Unexpected owner URL: $owner_url" >&2; exit 1 ;;
          esac
